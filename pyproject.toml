[project]
name = "winston-entertainment-system"
version = "1.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests", "engine/test_integration.py"]
pythonpath = ["."]
filterwarnings = ["error::pytest.PytestReturnNotNoneWarning"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["legacy_reference"]

[tool.ruff.lint]
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
"engine/__init__.py" = ["F401"]
"wes.spec" = ["F821"]
